[package]
name = "baro"
version = "0.1.0"
edition = "2021"
description = "바로보기 — fast image viewer and converter"
publish = false

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui", "dep:rfd"]

[dependencies]
zune-jpeg = "0.4"
zune-core = "0.4"
png = "0.17"
gif = "0.13"
resvg = "0.45"
usvg = "0.45"
tiny-skia = "0.11"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
eframe = { version = "0.31", optional = true }
egui = { version = "0.31", optional = true }
rfd = { version = "0.15", optional = true }

[[bin]]
name = "baro"
path = "src/main.rs"
required-features = ["gui"]
